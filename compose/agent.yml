# CamStack agent on Proxmox (AMD image). Installed by install-camstack-proxmox.sh
# into /opt/camstack/docker-compose.yml inside the LXC.
services:
  camstack:
    image: ghcr.io/camstack/camstack:amd-latest
    container_name: camstack-agent
    restart: unless-stopped
    network_mode: host
    pids_limit: 8192
    # Accelerators: uncomment what this CT has. The installer uncomments the
    # lines (marked #@…) for the devices it passed into the CT as `devN:`
    # entries. Docker refuses to start with a device the CT does not have.
    # devices:                                    #@devices
      # Intel / AMD iGPU: VAAPI/QSV decode, OpenVINO GPU, ONNX WebGPU
      # - /dev/dri:/dev/dri                       #@dri
      # Intel NPU (Core Ultra, OpenVINO NPU) / AMD XDNA NPU (detected only)
      # - /dev/accel:/dev/accel                   #@accel
      # AMD ROCm compute (optional; the image carries no ROCm runtime today)
      # - /dev/kfd:/dev/kfd                       #@kfd
      # Coral USB: the whole bus, the stick re-enumerates after firmware load
      # - /dev/bus/usb:/dev/bus/usb               #@usb
      # Coral PCIe / M.2: one line per unit; needs the host gasket/apex driver
      # - /dev/apex_0:/dev/apex_0                 #@apex_0
      # - /dev/apex_1:/dev/apex_1                 #@apex_1
    # device_cgroup_rules:                        #@usb
      # Coral USB: any USB minor (major 189), so a re-enumerated stick opens
      # - 'c 189:* rmw'                           #@usb
    # NVIDIA (CUDA): needs the NVIDIA driver in the CT (same version as the
    # host) and the NVIDIA Container Toolkit; the installer never enables it.
    # Also set image: to ghcr.io/camstack/camstack:nvidia-latest (RTX 20+ /
    # GTX 16) or :nvidia-legacy-latest (GTX 10 / 9), or install with IMAGE_TAG.
    # gpus: all
    # No group_add is needed for any device above: the image entrypoint chowns
    # every passed /dev/dri, /dev/accel and /dev/apex_* node to `camstack` and
    # opens Coral USB nodes, then drops supplementary groups (gosu), so these
    # GIDs (video=44, render=993) reach only the root entrypoint shell.
    group_add:
      - "44"
      - "993"
      - "1001"
    volumes:
      - /opt/camstack/data:/data
      - /opt/camstack/backups:/backups
      - /opt/camstack/recordings:/recordings
      # Optional: a second disk for media, added later as a storage location
      # from the admin UI (Storage). Mount it at any free container path, e.g.
      # - /mnt/fast-ssd/camstack:/media-fast
    environment:
      # hub | agent. One image serves both roles; this picks which at boot.
      - CAMSTACK_ROLE=agent
      # Container path every recording and event file is written under. Must
      # match the recordings volume below, or media lands in /data.
      - CAMSTACK_MEDIA_ROOT=/recordings
      # true | false. Keep false: nodes then advertise their IP instead of a
      # container hostname the other machines cannot resolve, so a
      # multi-machine cluster forms. true only for a single-host test setup.
      - CAMSTACK_MOLECULER_USE_HOSTNAME=false
      # trace | debug | info | warn | error. Forked addon runners inherit it.
      - CAMSTACK_LOG_LEVEL=info
      # The node's default time zone (IANA, e.g. Europe/Rome). Unset or empty
      # means UTC. The install script fills it from the Proxmox host.
      - TZ=${TZ:-UTC}
      # Set by the install script when provided. All may stay blank: the agent
      # is then found on the network and paired from the hub (Cluster → Nodes).
      # IP or hostname of the hub to join.
      - CAMSTACK_HUB_ADDRESS=${CAMSTACK_HUB_ADDRESS:-}
      # Full hub URL (e.g. https://10.0.0.5:4443), only for a non-default port
      # or a proxy; blank derives it from CAMSTACK_HUB_ADDRESS.
      - CAMSTACK_HUB_URL=${CAMSTACK_HUB_URL:-}
      # Stable, unique id of this agent (e.g. gpu-box). Never change it once
      # the hub knows it. Blank = the container hostname.
      - CAMSTACK_NODE_ID=${CAMSTACK_NODE_ID:-}
      # Label in the topology view. Blank = the node id.
      - CAMSTACK_AGENT_NAME=${CAMSTACK_AGENT_NAME:-}
      # Optional (default shown): port of the agent status page and API.
      # - CAMSTACK_STATUS_PORT=4444
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
